[project]
name = "leaklocate"
version = "0.1.0"
description = "Sensor planning and calibrated leak localization for water distribution networks"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "epyt-flow>=0.17.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "wntr>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
ignore = ["RUF046", "PLR0402", "RUF059"]
